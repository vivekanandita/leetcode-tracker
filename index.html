<meta charset="UTF-8">

<title>LeetCode Daily Tracker 2026</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-sec: #f7f7f5;
    --bg-ter: #f0f0ec;
    --text: #1a1a1a;
    --text-sec: #6b6b6b;
    --text-ter: #9b9b9b;
    --border: rgba(0,0,0,0.1);
    --border-med: rgba(0,0,0,0.18);
    --green: #3B6D11;
    --green-bg: #EAF3DE;
    --green-mid: #639922;
    --amber: #854F0B;
    --amber-bg: #FAEEDA;
    --amber-mid: #EF9F27;
    --red: #A32D2D;
    --red-bg: #FCEBEB;
    --blue: #185FA5;
    --blue-bg: #E6F1FB;
    --blue-mid: #378ADD;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --bg-sec: #242424;
      --bg-ter: #2e2e2e;
      --text: #f0f0ec;
      --text-sec: #a0a0a0;
      --text-ter: #6b6b6b;
      --border: rgba(255,255,255,0.1);
      --border-med: rgba(255,255,255,0.18);
      --green-bg: #1a2e09;
      --amber-bg: #2e1f06;
      --red-bg: #2e0f0f;
      --blue-bg: #0a1e35;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-ter); color: var(--text); min-height: 100vh; }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 36px; height: 36px; background: #F97316; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 20px; height: 20px; fill: white; }
  .logo-text { font-size: 20px; font-weight: 600; color: var(--text); }
  .logo-sub { font-size: 13px; color: var(--text-sec); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 600; color: var(--text); }
  .stat-lbl { font-size: 11px; color: var(--text-sec); margin-top: 2px; }

  /* Progress bar */
  .progress-wrap { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sec); margin-bottom: 8px; }
  .progress-bar { height: 6px; background: var(--bg-ter); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green-mid); border-radius: 3px; transition: width 0.3s; width: 0%; }

  /* Activity dots */
  .activity-wrap { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  .activity-title { font-size: 12px; color: var(--text-sec); margin-bottom: 8px; }
  .dots { display: flex; flex-wrap: wrap; gap: 3px; }
  .dot { width: 13px; height: 13px; border-radius: 3px; background: var(--bg-ter); cursor: default; }
  .dot.done { background: var(--green-mid); }
  .dot.partial { background: var(--amber-mid); }
  .dot.today-dot { background: var(--blue-mid); outline: 2px solid var(--blue); outline-offset: 1px; }

  /* Controls */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .controls input, .controls select {
    font-size: 13px; padding: 7px 11px;
    border-radius: var(--radius); border: 0.5px solid var(--border-med);
    background: var(--bg); color: var(--text); outline: none;
  }
  .controls input:focus, .controls select:focus { border-color: var(--blue-mid); }
  .controls input { width: 200px; }
  .btn {
    font-size: 13px; padding: 7px 14px;
    border-radius: var(--radius); border: 0.5px solid var(--border-med);
    background: var(--bg); color: var(--text); cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .btn:hover { background: var(--bg-sec); }
  .btn-primary { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .btn-primary:hover { background: var(--green-bg); opacity: 0.85; }

  /* Phase divider */
  .phase-div {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 600; color: var(--green);
    padding: 10px 14px; background: var(--green-bg);
    border-radius: var(--radius); margin: 20px 0 10px;
    border-left: 3px solid var(--green);
  }

  /* Week header */
  .week-hdr {
    font-size: 12px; font-weight: 500; color: var(--text-sec);
    padding: 8px 0 5px; border-bottom: 0.5px solid var(--border);
    margin-bottom: 8px;
  }

  /* Day card */
  .day-card {
    background: var(--bg); border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 8px;
  }
  .day-card.is-today { border: 2px solid var(--blue-mid); }
  .day-card.all-done { background: var(--bg-sec); }

  .day-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .day-date { font-size: 14px; font-weight: 500; color: var(--text); flex: 1; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .tag-today { background: var(--blue-bg); color: var(--blue); }
  .tag-weekday { background: var(--green-bg); color: var(--green); }
  .tag-weekend { background: var(--amber-bg); color: var(--amber); }
  .day-count { font-size: 12px; color: var(--text-sec); }

  /* Question row */
  .q-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-top: 0.5px solid var(--border);
  }
  .q-cb { width: 15px; height: 15px; cursor: pointer; accent-color: var(--green); flex-shrink: 0; }
  .q-link { font-size: 13px; color: var(--blue); text-decoration: none; flex: 1; }
  .q-link:hover { text-decoration: underline; }
  .q-link.done-link { text-decoration: line-through; opacity: 0.45; }
  .diff { font-size: 11px; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; font-weight: 500; }
  .diff-easy { background: var(--green-bg); color: var(--green); }
  .diff-medium { background: var(--amber-bg); color: var(--amber); }
  .diff-hard { background: var(--red-bg); color: var(--red); }
  .q-topic { font-size: 11px; color: var(--text-ter); flex-shrink: 0; display: none; }
  @media(min-width:600px){ .q-topic { display: inline; } }

  /* Empty state */
  .empty { text-align: center; padding: 40px; color: var(--text-sec); font-size: 14px; }
</style>

const PHASE_INFO = [
  {phase:1, label:"Phase 1 – Foundation",       weeks:[1,4],  icon:"📦"},
  {phase:2, label:"Phase 2 – Core Patterns",    weeks:[5,10], icon:"🧩"},
  {phase:3, label:"Phase 3 – Advanced",         weeks:[11,18],icon:"⚡"},
  {phase:4, label:"Phase 4 – Interview Mode",   weeks:[19,99],icon:"🎯"},
];

function getPhase(w){ return w<=4?1:w<=10?2:w<=18?3:4; }
function isWE(d){ return d.getDay()===0||d.getDay()===6; }
function sameDay(a,b){ return a.toDateString()===b.toDateString(); }
function dayKey(d){ return d.toISOString().slice(0,10); }

// Build schedule
const START = new Date(2026,5,15);
const END   = new Date(2026,11,31);

function buildSchedule(){
  const sched=[]; let qi=0; let dn=0;
  let d=new Date(START);
  while(d<=END){
    const cnt=isWE(d)?5:2;
    const qs=[];
    for(let i=0;i<cnt;i++){ qs.push(QUESTIONS[qi%QUESTIONS.length]); qi++; }
    sched.push({date:new Date(d), qs, weekend:isWE(d), weekNum:Math.floor(dn/7)+1, phase:getPhase(Math.floor(dn/7)+1)});
    d.setDate(d.getDate()+1); dn++;
  }
  return sched;
}

const SCHED = buildSchedule();
const TOTAL = SCHED.reduce((a,d)=>a+d.qs.length,0);
document.getElementById('s-total').textContent=TOTAL;

// Populate topic filter
const topics=[...new Set(QUESTIONS.map(q=>q.topic))].sort();
const tf=document.getElementById('f-topic');
topics.forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; tf.appendChild(o); });

// State
let done = JSON.parse(localStorage.getItem('lc2026_done')||'{}');
function save(){ try{ localStorage.setItem('lc2026_done',JSON.stringify(done)); }catch(e){} }

function qKey(d,i){ return dayKey(d.date)+'_'+i; }
function countDone(){ return Object.values(done).filter(Boolean).length; }

function computeStreak(){
  const today=new Date(); let streak=0;
  let d=new Date(today);
  while(true){
    const day=SCHED.find(s=>sameDay(s.date,d));
    if(!day) break;
    const all=day.qs.every((_,i)=>done[qKey(day,i)]);
    if(all) streak++; else break;
    d.setDate(d.getDate()-1);
    if(d<START) break;
  }
  return streak;
}

function updateStats(){
  const n=countDone();
  document.getElementById('s-done').textContent=n;
  document.getElementById('s-streak').textContent=computeStreak()+' 🔥';
  document.getElementById('s-pct').textContent=Math.round(n/TOTAL*100)+'%';
  document.getElementById('prog-label').textContent=n+' / '+TOTAL;
  document.getElementById('prog-fill').style.width=Math.round(n/TOTAL*100)+'%';
  renderDots();
}

function renderDots(){
  const today=new Date();
  const shown=SCHED.filter(d=>d.date<=today).slice(-70);
  document.getElementById('dots').innerHTML=shown.map(d=>{
    const total=d.qs.length;
    const dc=d.qs.filter((_,i)=>done[qKey(d,i)]).length;
    let cls='dot';
    if(sameDay(d.date,today)) cls+=' today-dot';
    else if(dc===total&&total>0) cls+=' done';
    else if(dc>0) cls+=' partial';
    return `<div class="${cls}" title="${d.date.toDateString()} · ${dc}/${total} done"></div>`;
  }).join('');
}

function toggle(key, val){
  done[key]=val; save(); updateStats();
  // update just the checkbox label without full re-render
  const label=document.querySelector(`[data-key="${key}"]`);
  if(label){ const link=label.parentElement.querySelector('.q-link'); if(link){ link.classList.toggle('done-link',val); } }
  updateStats();
}

function fmt(d){ return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }

function render(){
  const today=new Date();
  const search=document.getElementById('search').value.toLowerCase();
  const fp=document.getElementById('f-phase').value;
  const fd=document.getElementById('f-diff').value;
  const ft=document.getElementById('f-topic').value;

  let lastPhase=null, lastWeek=null;
  let html='', count=0;

  SCHED.forEach(d=>{
    if(fp && d.phase!=fp) return;
    const matchQs=d.qs.filter((q,i)=>{
      if(fd && q.diff!==fd) return false;
      if(ft && q.topic!==ft) return false;
      if(search && !q.title.toLowerCase().includes(search) && !String(q.id).includes(search)) return false;
      return true;
    });
    if(!matchQs.length) return;
    count++;

    if(d.phase!==lastPhase){
      const pi=PHASE_INFO.find(p=>p.phase===d.phase);
      html+=`<div class="phase-div">${pi.icon} ${pi.label}</div>`;
      lastPhase=d.phase; lastWeek=null;
    }
    if(d.weekNum!==lastWeek){
      html+=`<div class="week-hdr">Week ${d.weekNum}</div>`;
      lastWeek=d.weekNum;
    }

    const isToday=sameDay(d.date,today);
    const dc=d.qs.filter((_,i)=>done[qKey(d,i)]).length;
    const allDone=dc===d.qs.length;

    let qhtml='';
    d.qs.forEach((q,i)=>{
      if(fd && q.diff!==fd) return;
      if(ft && q.topic!==ft) return;
      if(search && !q.title.toLowerCase().includes(search) && !String(q.id).includes(search)) return;
      const k=qKey(d,i);
      const chk=done[k]?'checked':'';
      const dl=done[k]?' done-link':'';
      qhtml+=`<div class="q-row">
        <input type="checkbox" class="q-cb" data-key="${k}" ${chk} onchange="toggle('${k}',this.checked)">
        <a href="https://leetcode.com/problems/${q.slug}/" target="_blank" rel="noopener" class="q-link${dl}">#${q.id} · ${q.title}</a>
        <span class="diff diff-${q.diff.toLowerCase()}">${q.diff}</span>
        <span class="q-topic">${q.topic}</span>
      </div>`;
    });

    html+=`<div class="day-card${isToday?' is-today':''}${allDone?' all-done':''}" id="day-${dayKey(d.date)}">
      <div class="day-top">
        <span class="day-date">${fmt(d.date)}</span>
        ${isToday?'<span class="tag tag-today">Today</span>':''}
        <span class="tag ${d.weekend?'tag-weekend':'tag-weekday'}">${d.weekend?'Weekend · 5 questions':'Weekday · 2 questions'}</span>
        <span style="font-size:12px;color:var(--text-sec);margin-left:auto">${dc}/${d.qs.length} done</span>
      </div>
      ${qhtml}
    </div>`;
  });

  if(!count) html='<div class="empty">No questions match your filters.</div>';
  document.getElementById('list').innerHTML=html;
  updateStats();
}

function scrollToToday(){
  const today=new Date();
  const key=dayKey(today);
  const el=document.getElementById('day-'+key);
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  else alert('Today is not in the schedule range (Jun 15 – Dec 31 2026).');
}

function confirmReset(){
  if(confirm('This will clear ALL your progress. Are you sure?')){ done={}; save(); render(); }
}

render();
setTimeout(scrollToToday, 400);
